services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      API_URL: http://backend:8000
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["5173:5173"]
    depends_on: [backend]
